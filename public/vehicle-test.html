<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test Vehicle API - MotorCare</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                padding: 20px;
                min-height: 100vh;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
                background: white;
                border-radius: 20px;
                padding: 30px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            }
            h1 {
                color: #667eea;
                margin-bottom: 10px;
                font-size: 32px;
            }
            .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 14px;
            }
            .section {
                margin-bottom: 30px;
                padding: 20px;
                background: #f8f9fa;
                border-radius: 10px;
                border-left: 4px solid #667eea;
            }
            .section h2 {
                color: #333;
                margin-bottom: 15px;
                font-size: 20px;
            }
            .form-group {
                margin-bottom: 15px;
            }
            label {
                display: block;
                margin-bottom: 5px;
                color: #555;
                font-weight: 600;
                font-size: 14px;
            }
            input[type="text"],
            input[type="number"],
            input[type="file"],
            select,
            textarea {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 14px;
                transition: all 0.3s;
            }
            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #667eea;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }
            textarea {
                resize: vertical;
                min-height: 80px;
            }
            button {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 12px 30px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
                transition: all 0.3s;
                width: 100%;
            }
            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            }
            button:active {
                transform: translateY(0);
            }
            .response {
                margin-top: 20px;
                padding: 15px;
                background: #fff;
                border-radius: 8px;
                border: 2px solid #e0e0e0;
                max-height: 400px;
                overflow-y: auto;
            }
            .response h3 {
                color: #667eea;
                margin-bottom: 10px;
                font-size: 16px;
            }
            .response pre {
                background: #f8f9fa;
                padding: 15px;
                border-radius: 5px;
                overflow-x: auto;
                font-size: 12px;
                line-height: 1.5;
            }
            .alert {
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 15px;
            }
            .alert-info {
                background: #d1ecf1;
                border-left: 4px solid #0c5460;
                color: #0c5460;
            }
            .alert-success {
                background: #d4edda;
                border-left: 4px solid #155724;
                color: #155724;
            }
            .alert-error {
                background: #f8d7da;
                border-left: 4px solid #721c24;
                color: #721c24;
            }
            .token-display {
                word-break: break-all;
                font-family: monospace;
                font-size: 12px;
                background: #f8f9fa;
                padding: 10px;
                border-radius: 5px;
                margin-top: 5px;
            }
            .required {
                color: #dc3545;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            @media (max-width: 600px) {
                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🏍️ Vehicle API Tester</h1>
            <p class="subtitle">MotorCare - Test API Tambah Kendaraan</p>

            <!-- Login Section -->
            <div class="section">
                <h2>1. Login Dulu</h2>
                <div class="alert alert-info">
                    <strong>Info:</strong> Login terlebih dahulu untuk
                    mendapatkan token JWT
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input
                            type="text"
                            id="loginEmail"
                            value="test@example.com"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input
                            type="text"
                            id="loginPassword"
                            value="password123"
                            required
                        />
                    </div>
                    <button type="submit">Login</button>
                </form>
                <div id="tokenDisplay" style="display: none">
                    <label>Token JWT:</label>
                    <div class="token-display" id="tokenValue"></div>
                </div>
            </div>

            <!-- Add Vehicle Section -->
            <div class="section">
                <h2>2. Tambah Kendaraan</h2>
                <div class="alert alert-info">
                    <strong>Info:</strong> Upload foto motor dan isi data
                    kendaraan
                </div>
                <form id="vehicleForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label
                            >Nama Kendaraan
                            <span class="required">*</span></label
                        >
                        <input
                            type="text"
                            id="title"
                            placeholder="Honda Beat 2023"
                            required
                        />
                    </div>

                    <div class="grid">
                        <div class="form-group">
                            <label>Merek</label>
                            <input type="text" id="make" placeholder="Honda" />
                        </div>
                        <div class="form-group">
                            <label>Model</label>
                            <input type="text" id="model" placeholder="Beat" />
                        </div>
                    </div>

                    <div class="grid">
                        <div class="form-group">
                            <label>Tahun</label>
                            <input
                                type="number"
                                id="year"
                                placeholder="2023"
                                min="1900"
                                max="2026"
                            />
                        </div>
                        <div class="form-group">
                            <label
                                >Tipe Motor
                                <span class="required">*</span></label
                            >
                            <select id="tipe_motor" required>
                                <option value="">Pilih Tipe</option>
                                <option value="matic">Matic</option>
                                <option value="manual">Manual</option>
                                <option value="sport">Sport</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid">
                        <div class="form-group">
                            <label>Odometer (km)</label>
                            <input
                                type="number"
                                id="odometer"
                                placeholder="5000"
                                min="0"
                            />
                        </div>
                        <div class="form-group">
                            <label>Plat Nomor (Opsional)</label>
                            <input
                                type="text"
                                id="license_plate"
                                placeholder="B 1234 XYZ"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Warna</label>
                        <input type="text" id="color" placeholder="Merah" />
                    </div>

                    <div class="form-group">
                        <label>Foto Kendaraan (Opsional - Max 5MB)</label>
                        <input
                            type="file"
                            id="photo"
                            accept="image/jpeg,image/jpg,image/png,image/webp"
                        />
                        <small style="color: #666"
                            >Format: JPEG, JPG, PNG, WEBP</small
                        >
                    </div>

                    <button type="submit">Tambah Kendaraan</button>
                </form>
            </div>

            <!-- Response Section -->
            <div class="response" id="responseSection" style="display: none">
                <h3>Response:</h3>
                <pre id="responseData"></pre>
            </div>
        </div>

        <script>
            const API_URL = "http://localhost:8000/api/v1/motorcycle";
            let authToken = "";

            // Login Form Submit
            document
                .getElementById("loginForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const email = document.getElementById("loginEmail").value;
                    const password =
                        document.getElementById("loginPassword").value;

                    try {
                        const response = await fetch(`${API_URL}/auth/login`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                Accept: "application/json",
                            },
                            body: JSON.stringify({ email, password }),
                        });

                        const data = await response.json();

                        if (data.success && data.data.access_token) {
                            authToken = data.data.access_token;
                            document.getElementById(
                                "tokenDisplay"
                            ).style.display = "block";
                            document.getElementById("tokenValue").textContent =
                                authToken;
                            showResponse(data, "success");
                        } else {
                            showResponse(data, "error");
                        }
                    } catch (error) {
                        showResponse({ error: error.message }, "error");
                    }
                });

            // Vehicle Form Submit
            document
                .getElementById("vehicleForm")
                .addEventListener("submit", async (e) => {
                    e.preventDefault();

                    if (!authToken) {
                        alert("Login terlebih dahulu untuk mendapatkan token!");
                        return;
                    }

                    const formData = new FormData();

                    // Add all form fields
                    const fields = [
                        "title",
                        "make",
                        "model",
                        "year",
                        "tipe_motor",
                        "odometer",
                        "license_plate",
                        "color",
                    ];
                    fields.forEach((field) => {
                        const value = document.getElementById(field).value;
                        if (value) {
                            formData.append(field, value);
                        }
                    });

                    // Add photo file
                    const photoFile = document.getElementById("photo").files[0];
                    if (photoFile) {
                        formData.append("photo", photoFile);
                    }

                    try {
                        const response = await fetch(`${API_URL}/vehicles`, {
                            method: "POST",
                            headers: {
                                Authorization: `Bearer ${authToken}`,
                                Accept: "application/json",
                            },
                            body: formData,
                        });

                        const data = await response.json();

                        if (data.success) {
                            showResponse(data, "success");
                            document.getElementById("vehicleForm").reset();
                            alert("Kendaraan berhasil ditambahkan! ✅");
                        } else {
                            showResponse(data, "error");
                        }
                    } catch (error) {
                        showResponse({ error: error.message }, "error");
                    }
                });

            function showResponse(data, type) {
                const responseSection =
                    document.getElementById("responseSection");
                const responseData = document.getElementById("responseData");

                responseSection.style.display = "block";
                responseData.textContent = JSON.stringify(data, null, 2);

                responseSection.scrollIntoView({
                    behavior: "smooth",
                    block: "nearest",
                });
            }
        </script>
    </body>
</html>
